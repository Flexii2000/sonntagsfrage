# /etc/nginx/snippets/wahlen.conf
#
# Wird per include in den 443-Serverblock von
# /etc/nginx/sites-available/fherrmann.com eingebunden.
# Gleiches Muster wie /aspria/.
#
# Kein abschliessender Slash bei location und proxy_pass: der Pfad /wahlen/...
# geht unveraendert an die App, die ihn als context-path selbst erwartet.

location /wahlen {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_redirect off;

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
}

# Statische Dateien duerfen lange im Browsercache bleiben.
location /wahlen/css/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    expires 1h;
    add_header Cache-Control "public";
}

location /wahlen/js/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    expires 1h;
    add_header Cache-Control "public";
}
