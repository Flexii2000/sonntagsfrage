# Wahltermine und amtliche Ergebnisse.
#
# DAWUM liefert nur Umfragen — Termine und Ergebnisse sind hier von Hand
# gepflegt. Das sind rund zwei Dutzend Datensaetze, die sich nach einer Wahl
# genau einmal aendern; Handpflege ist hier robuster als jede Automatik.
#
# Regeln:
#   parliament     Slug aus parliaments.yaml
#   date           exaktes Datum; bei unbestaetigten Terminen die beste
#                  Schaetzung PLUS dateConfirmed: false
#   dateConfirmed  false = Termin noch nicht amtlich; loest KEIN Featuring aus
#   status         HELD | SCHEDULED
#   results        Parteikuerzel (DAWUM-Schreibweise!) -> Prozent
#                  Achtung: Bundestag/Europaparlament nutzen "CDU/CSU",
#                  Bayern nutzt "CSU", alle anderen Laender "CDU".
#   seats          tatsaechliche Groesse des gewaehlten Parlaments
#   source         Beleg-URL; bei Aktualisierung bitte mitpflegen
#
# Ergebnisse sind Zweitstimmen- bzw. Landesstimmenanteile.

