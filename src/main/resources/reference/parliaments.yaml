# Stammdaten der Parlamente, die DAWUM nicht liefert: URL-Slug, Ebene,
# Sperrklausel, regulaere Sitzzahl und Sortierung.
#
# Die IDs sind die DAWUM-Parlaments-IDs.
#
# seats = die REGULAERE (gesetzliche) Groesse des Parlaments. Sie ist die Basis
# der Sitzprojektion. Die tatsaechliche Groesse nach einer Wahl weicht durch
# Ueberhang- und Ausgleichsmandate ab — das laesst sich aus einer Umfrage
# ohnehin nicht ableiten und wird im UI als Vereinfachung ausgewiesen.

parliaments:
