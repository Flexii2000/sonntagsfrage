# Parteifarben und Sortierung.
#
# Massgeblich ist die Farbe, die sich die Partei selbst gibt — nicht das
# Ergebnis einer Kontrastoptimierung. Eine "bessere" Palette waere fuer
# deutsche Leser schlicht falsch: SPD ist rot, die Gruenen sind gruen, die
# Linke ist dunkelrot/violett (#BE3075, ihre CI-Farbe).
#
# Das heisst zwangslaeufig, dass Rot, Gruen und Gelb dicht beieinander liegen.
# Farbe ist hier deshalb nicht der einzige Identitaetskanal — jede Serie traegt
# zusaetzlich immer
#   - eine Direktbeschriftung mit dem Parteikuerzel am Kurvenende,
#   - einen Legendeneintrag mit Text,
#   - das Kuerzel im Crosshair-Tooltip,
#   - eine Tabellenansicht als vollwertige Alternative,
#   - optional (Schalter "Muster") zusaetzliche Strichmuster.
#
# Die Dark-Mode-Werte sind eigenstaendig gewaehlt, keine Aufhellung: Gelb
# (FDP) verschwindet sonst. Sie bleiben so nah wie moeglich an der Original-CI
# und werden nur so weit angehoben, dass die Linie auf dunklem Grund nicht
# verschwindet.
#
# Ausnahme seit 2026-09-12 (Felix): die Union bleibt auch im Dark Mode
# schwarz. Damit Schwarz auf dunklem Grund nicht untergeht, bekommen sehr
# dunkle Farben in chart.js einen hellen Saum (Halo unter der Linie, Hairline
# um Punkte und Farbfelder) - entschieden ueber die Leuchtdichte der Farbe,
# nicht ueber den Parteinamen.
#
# "spectrum" ordnet die Parteien fuer den Sitzbogen von links nach rechts —
# die uebliche Sitzordnung deutscher Parlamente. Das ist eine Konvention, keine
# Bewertung; ohne sie wuerde der Bogen nach Fraktionsgroesse sortieren und
# saehe fuer jeden, der Sitzbogen kennt, falsch aus. Parteien ohne Wert landen
# am rechten Rand.
#
# Schluessel ist das DAWUM-Kuerzel.

parties:
  - shortcut: "CDU/CSU"
    light: "#2C2C2C"
    dark: "#000000"
    order: 10
    spectrum: 70
  - shortcut: "CDU"
    light: "#2C2C2C"
    dark: "#000000"
    order: 11
    spectrum: 71
